name: Desplegar Mi Agenda en GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Flutter Web para GitHub Pages
        run: flutter build web --release --base-href "/mi-agenda/"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
